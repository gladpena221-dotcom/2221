<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на онлайн-курс</title>
</head>
<body>

    <header>
        <h1>Реєстрація на онлайн-курс</h1>
        <p>Заповніть форму нижче для запису на навчальну програму.</p>
    </header>

    <main>
        <section>
            <h2>Анкета студента</h2>

            <form action="#" method="post">
                <p>
                    <label for="first-name">Ім'я:</label>
                    <input type="text" id="first-name" name="firstName" placeholder="Введіть ваше ім'я" required>
                </p>

                <p>
                    <label for="last-name">Прізвище:</label>
                    <input type="text" id="last-name" name="lastName" placeholder="Введіть ваше прізвище" required>
                </p>

                <p>
                    <label for="user-email">Електронна пошта (Email):</label>
                    <input type="email" id="user-email" name="email" placeholder="example@mail.com" required>
                </p>
                <p>
                    <button type="submit">Надіслати заявку</button>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
